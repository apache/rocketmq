// Documentation-only RIP-2 public API draft.
// This file is intentionally placed under docs/ and is not part of the Maven
// build or protobuf generation. The real API should land only after
// rocketmq-apis ownership and compatibility are confirmed by the community.

syntax = "proto3";

package apache.rocketmq.v2;

option java_multiple_files = true;
option java_package = "apache.rocketmq.v2";

// The final file should import or colocate the existing v2 Status and
// ClientType definitions according to the rocketmq-apis ownership decision.
//
// The M1 adapter normalizes request string fields before internal validation:
// surrounding whitespace is trimmed, and blank values are treated as absent.
// Public contest-facing requests use page_num/page_size, with page_size capped
// at 100. The existing internal page-token path remains an implementation
// detail for coordinator experiments and early adapter tests.

service ProxyAdminService {
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc DescribeClient(DescribeClientRequest) returns (DescribeClientResponse);
  rpc ListClientsByGroup(ListClientsByGroupRequest)
      returns (ListClientsByGroupResponse);
  rpc ListClientsByTopic(ListClientsByTopicRequest)
      returns (ListClientsByTopicResponse);
}

enum ProxyScope {
  PROXY_SCOPE_UNSPECIFIED = 0;

  // M1 public endpoints accept only the default or explicit local scope.
  PROXY_SCOPE_LOCAL_PROXY = 1;

  // Reserved for future fan-out and targeted proxy query semantics. M1 public
  // endpoints reject these scopes with BAD_REQUEST before request context
  // creation.
  PROXY_SCOPE_ALL_PROXIES = 2;
  PROXY_SCOPE_PROXY_ID = 3;
}

message ListClientsRequest {
  // Exact client id filter. Empty means no exact-id filter.
  string client_id = 1;
  string client_id_prefix = 2;
  string group = 3;
  string topic = 4;
  string client_language = 5;
  int64 connect_time_start_millis = 6;
  int64 connect_time_end_millis = 7;
  // Public page numbers are 1-based. M1 rejects values smaller than 1.
  int32 page_num = 8;
  // M1 caps page_size at 100.
  int32 page_size = 9;
  ProxyScope scope = 10;

  // Future PROXY_SCOPE_PROXY_ID requests must set this field. M1 public
  // endpoints reject PROXY_SCOPE_PROXY_ID before request context creation and
  // ignore this field for PROXY_SCOPE_LOCAL_PROXY.
  string proxy_id = 11;
}

message ListClientsResponse {
  Status status = 1;
  repeated ProxyClient clients = 2;
  // True when another page can be requested with page_num + 1.
  bool has_more = 3;
}

message DescribeClientRequest {
  string client_id = 1;
  ProxyScope scope = 2;

  // Future PROXY_SCOPE_PROXY_ID requests must set this field. M1 public
  // endpoints reject PROXY_SCOPE_PROXY_ID before request context creation and
  // ignore this field for PROXY_SCOPE_LOCAL_PROXY.
  string proxy_id = 3;
}

message DescribeClientResponse {
  Status status = 1;
  ProxyClient client = 2;
}

message ListClientsByGroupRequest {
  string group = 1;
  string client_id = 2;
  string client_id_prefix = 3;
  string client_language = 4;
  int64 connect_time_start_millis = 5;
  int64 connect_time_end_millis = 6;
  int32 page_num = 7;
  // M1 caps page_size at 100.
  int32 page_size = 8;
  ProxyScope scope = 9;

  // Future PROXY_SCOPE_PROXY_ID requests must set this field. M1 public
  // endpoints reject PROXY_SCOPE_PROXY_ID before request context creation and
  // ignore this field for PROXY_SCOPE_LOCAL_PROXY.
  string proxy_id = 10;
}

message ListClientsByGroupResponse {
  Status status = 1;
  repeated ProxyClient clients = 2;
  bool has_more = 3;
}

message ListClientsByTopicRequest {
  string topic = 1;
  string client_id = 2;
  string client_id_prefix = 3;
  string client_language = 4;
  int64 connect_time_start_millis = 5;
  int64 connect_time_end_millis = 6;
  int32 page_num = 7;
  // M1 caps page_size at 100.
  int32 page_size = 8;
  ProxyScope scope = 9;

  // Future PROXY_SCOPE_PROXY_ID requests must set this field. M1 public
  // endpoints reject PROXY_SCOPE_PROXY_ID before request context creation and
  // ignore this field for PROXY_SCOPE_LOCAL_PROXY.
  string proxy_id = 10;
}

message ListClientsByTopicResponse {
  Status status = 1;
  repeated ProxyClient clients = 2;
  bool has_more = 3;
}

message ProxyClient {
  string client_id = 1;
  ClientType client_type = 2;

  // Server-normalized, nonblank, de-duplicated values. M1 responses use
  // deterministic lexicographic order.
  repeated string groups = 3;
  repeated string topics = 4;

  // Server-normalized metadata required by the RIP-2 contest issue. Missing or
  // blank values are returned as empty strings.
  string language = 5;
  string remote_address = 6;
  string local_address = 7;
  string version = 8;
  int64 connect_time_millis = 9;
  int64 last_active_time_millis = 10;
  string proxy_id = 11;
}
