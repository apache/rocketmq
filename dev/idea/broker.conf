# Local source debugging only; not a production deployment configuration.
brokerClusterName=SourceDebugCluster
brokerName=broker-source
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
namesrvAddr=127.0.0.1:9876
brokerIP1=127.0.0.1
brokerIP2=127.0.0.1
bindAddress=127.0.0.1
listenPort=10911
haListenPort=10912

# Relative to the repository root, set as the run configuration's working directory.
# devenv is already excluded by the repository's .gitignore.
storePathRootDir=./devenv/idea/store
mappedFileSizeCommitLog=67108864
defaultTopicQueueNums=4
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# Keep the initial debugging session small. Enable these when debugging those features.
timerWheelEnable=false
enableCompaction=false
